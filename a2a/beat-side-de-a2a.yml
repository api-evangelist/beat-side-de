discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: agentworld-api.beat-side.de
  note: >-
    AgentWorld serves the card from TWO hosts it controls. The API host agentworld-api.beat-side.de
    (the servers[] host of its OpenAPI, and the host every declared A2A interface lives on) serves
    the primary card saved here verbatim. The public-site host agentworld.beat-side.de serves a
    second copy (saved verbatim as the secondary file) that differs in four fields: provider.url and
    documentationUrl and x-fullDocumentation point at the site host, and supportedInterfaces[]
    declares ONLY the HTTP+JSON binding, omitting the JSONRPC interface the API-host card declares.
    The registrable domain beat-side.de (a German WordPress blog on the same owner's domain) 404s
    both /.well-known/agent-card.json and /.well-known/agent.json — the card is a property of the
    AgentWorld subdomains, not of the apex. The legacy /.well-known/agent.json path is a 308 redirect
    to agent-card.json on the API host and a 404 on the site host.
  ownership: >-
    Not in question. The card's provider.organization is "AgentWorld", its interfaces and
    x-fullDocumentation sit on the same host that serves the OpenAPI whose servers[] is
    https://agentworld-api.beat-side.de, the provider's own llms.txt and agents.json name this exact
    URL as the A2A discovery concierge, and the site's sitemap.xml lists it.
