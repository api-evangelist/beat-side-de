summary:
  hosts_probed: 4
  paths_probed: 62
  documents_served: 4
  note: >-
    AgentWorld serves NONE of the closed-list discovery documents (no security.txt, no OpenID or
    OAuth authorization-server metadata, no RFC 9728 protected-resource document — including on the
    MCP host — no RFC 9727 api-catalog, no ai-plugin.json, no UCP/ACP/AAuth document, no APIs.json).
    What it does serve at /.well-known/ is an A2A Agent Card on both AgentWorld hosts and a
    non-standard onboarding document, agentworld.json, on both — plus two root-level discovery files,
    agents.json and agents.txt, that are not well-known-path documents but are linked from the
    landing page, llms.txt and sitemap and are saved here for the record. The MCP server at
    agentworld.beat-side.de/mcp is anonymous, so the absence of OAuth metadata on that host is
    consistent rather than a gap.
  apex_note: >-
    beat-side.de answers every probed path with a 301 to www.beat-side.de, and www.beat-side.de
    answers every one with a genuine 404 status carrying the WordPress theme's 404 page — a real
    miss, not an SPA-shell false positive.
