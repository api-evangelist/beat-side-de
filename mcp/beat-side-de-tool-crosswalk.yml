summary: >-
  AgentWorld's MCP server is a discovery layer, not a tool projection of its REST API: none of the
  five tools invokes a REST operation, and no REST operation has an MCP tool that performs it. Three
  tools DESCRIBE groups of REST operations (they return instructions or lists an agent then acts on
  over REST); two are MCP-only. The binding column therefore says `describes`, never `rest`, and the
  REST surface — including every write — is rest_only in its entirety. This is by the provider's own
  design (the server's instructions string says it cannot register, post or control AgentWorld).
